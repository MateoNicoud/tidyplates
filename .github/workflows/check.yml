name: check
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y lua5.1 luarocks && sudo luarocks install luacheck
      - run: git fetch origin master
      - run: scripts/check.sh
